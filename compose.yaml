services:
  postgres:
    image: 'postgres:latest'
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - spring-postgres
    environment:
      - 'POSTGRES_DB=students_db'
      - 'POSTGRES_PASSWORD_FILE=/run/secrets/db-password'
      - 'POSTGRES_USER=abel'
    ports:
      - '5432'
  backend:
    build: src
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DB=students_db
    networks:
      - spring-postgres
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt
networks:
  spring-postgres:
